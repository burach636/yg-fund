<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YG Fund – ישיבת מהרי"ט ד'סאטמאר</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<header>
  <div class="logo3d sm" title='ישיבת מהרי"ט ד&#39;סאטמאר'><div class="in"><img src="logo.png" alt='ישיבת מהרי"ט ד&#39;סאטמאר'><i class="shine"></i></div></div>
  <div class="logo" id="logoTxt">YG Fund<small>פאנדרעיזינג סיסטעם · v1.17.3</small></div>
  <button class="btn ghost sm areabtn" id="btnArea" onclick="chooseArea()" style="display:none">⇄ ווקסל</button>
  <div class="spacer"></div>
  <div class="imp" id="impInfo"></div>
  <button class="btn gold" id="btnImport">⟳ דערהיינטיג פון JLS</button>
  <div class="who" id="whoBox"></div>
</header>
<nav id="nav">
  <button data-v="home" data-a="fund" class="on navhome">🏠 Dashboard</button>
  <button data-v="accounts" data-a="fund">👥 נדבות</button>
  <button data-v="rcpt" data-a="fund">🧾 רעסיטס/סטעיטמענטס</button>
  <button data-v="todo" data-a="fund">✅ To-Do <span class="cnt" id="cTodo"></span></button>
  <button data-v="fund" data-a="fund">💵 פאנדרעיזינג חשבונות</button>
  <button data-v="shuls" data-a="fund">🕍 שולן</button>
  <button data-v="today" data-a="fund">📋 היינט צו בעטן <span class="cnt" id="cToday"></span></button>
  <button data-v="pledges" data-a="fund">📞 פלעדזשעס דעם חודש <span class="cnt" id="cPl"></span></button>
  <button data-v="reports" data-a="fund">📊 באריכטן</button>
  <button data-v="jrep" data-a="fund">📑 רופארטס</button>
  <button data-v="thome" data-a="tu" class="navhome">🏠 Dashboard</button>
  <button data-v="tuition" data-a="tu">👨‍👦 עלטערן און תלמידים</button>
  <button data-v="tubill" data-a="tu">🧾 Billing</button>
  <button data-v="tustmt" data-a="tu">📄 סטעיטמענטס</button>
  <button data-v="todo" data-a="tu">✅ To-Do <span class="cnt" id="cTodoT"></span></button>
  <button data-v="settings">⚙️ Settings</button>
</nav>
<main id="main"><div class="empty">לאדנט...</div></main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="overlay" id="busy"><div class="modal busy"><div class="spin"></div><div id="busyTxt">ארבעט...</div></div></div>
<div class="toast" id="toast"></div>
<div class="dropmask" id="dropmask"><div>לאזט אראפ די Tuition.mdb דא</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="jls.js"></script>
<script src="cal.js"></script>
<script src="xlsx.js"></script>
<script src="sections.js"></script>
<script src="receipts.js"></script>
<script src="tuition.js"></script>
<script src="jreports.js"></script>
<script src="app.js"></script>
</body>
</html>
